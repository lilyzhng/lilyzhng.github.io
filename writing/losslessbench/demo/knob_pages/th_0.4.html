<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Translucent Calendar Popup</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    .calendar-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.85);
      border: 2px solid rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      padding: 2rem;
      width: 300px;
      max-width: 90%;
      text-align: center;
      backdrop-filter: blur(8px);
      animation: fadeIn 0.4s ease-in-out;
    }

    .calendar-popup h2 {
      margin: 0 0 1rem;
      font-size: 1.5rem;
      color: #333;
    }

    .calendar-popup .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      font-size: 0.9rem;
    }

    .calendar th {
      padding: 0.5rem;
      background: #eee;
      border-radius: 5px;
    }

    .calendar td {
      padding: 0.5rem;
      text-align: center;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .calendar td:hover {
      background: #f0f0f0;
    }

    .calendar td.selected {
      background: #007bff;
      color: white;
      border-radius: 5px;
    }

    .calendar-popup .actions {
      margin-top: 1.5rem;
    }

    .calendar-popup button {
      padding: 0.5rem 1rem;
      margin: 0 0.5rem;
      border: none;
      border-radius: 5px;
      background: #007bff;
      color: white;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .calendar-popup button:hover {
      background: #0056b3;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
  </style>
</head>
<body>

  <div class="calendar-popup" id="calendarPopup">
    <h2>Calendar</h2>
    <div class="calendar" id="calendar">
      <table>
        <thead>
          <tr>
            <th>Sun</th>
            <th>Mon</th>
            <th>Tue</th>
            <th>Wed</th>
            <th>Thu</th>
            <th>Fri</th>
            <th>Sat</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
          </tr>
          <tr>
            <td>1</td>
            <td>2</td>
            <td>3</td>
            <td>4</td>
            <td>5</td>
            <td>6</td>
            <td>7</td>
          </tr>
          <tr>
            <td>8</td>
            <td>9</td>
            <td>10</td>
            <td>11</td>
            <td>12</td>
            <td>13</td>
            <td>14</td>
          </tr>
          <tr>
            <td>15</td>
            <td>16</td>
            <td>17</td>
            <td>18</td>
            <td>19</td>
            <td>20</td>
            <td>21</td>
          </tr>
          <tr>
            <td>22</td>
            <td>23</td>
            <td>24</td>
            <td>25</td>
            <td>26</td>
            <td>27</td>
            <td>28</td>
          </tr>
          <tr>
            <td>29</td>
            <td>30</td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="actions">
      <button onclick="closeCalendar()">Close</button>
    </div>
  </div>

  <script>
    function closeCalendar() {
      const popup = document.getElementById('calendarPopup');
      popup.style.display = 'none';
    }

    // Simulating a date selection
    document.querySelectorAll('.calendar td').forEach(cell => {
      cell.addEventListener('click', () => {
        // Clear previous selection
        document.querySelectorAll('.calendar td').forEach(c => c.classList.remove('selected'));
        // Select current cell
        cell.classList.add('selected');
      });
    });
  </script>

</body>
</html>
