<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Translucent Calendar Popup</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      cursor: pointer;
    }

    .calendar-popup {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      padding: 20px;
      width: 300px;
      text-align: center;
      position: relative;
      z-index: 1001;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      animation: fadeIn 0.3s ease-in-out;
    }

    .calendar-popup h2 {
      margin: 0 0 15px;
      font-size: 1.5em;
    }

    .calendar-popup p {
      margin: 0;
      color: #555;
    }

    .calendar-popup .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      background: none;
      border: none;
      font-size: 1.2em;
      cursor: pointer;
      color: #999;
    }

    .calendar-popup .close-btn:hover {
      color: #333;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="overlay" onclick="document.querySelector('.calendar-popup').style.display='none'">
    <div class="calendar-popup" style="display: block;">
      <button class="close-btn" onclick="document.querySelector('.calendar-popup').style.display='none'">✖</button>
      <h2>Calendar</h2>
      <p>Click outside to close or the × button.</p>
    </div>
  </div>
</body>
</html>
