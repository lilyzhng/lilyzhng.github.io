<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Translucent Calendar Popup</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .calendar-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      padding: 2rem;
      width: 300px;
      animation: fadeIn 0.5s ease-out;
      z-index: 1000;
    }

    .calendar-popup::before {
      content: "";
      position: absolute;
      top: -10px;
      left: -10px;
      width: 120px;
      height: 120px;
      background: linear-gradient(135deg, #4a90e2, #76d7fa);
      border-radius: 50%;
      z-index: -1;
      opacity: 0.2;
    }

    h2 {
      margin-top: 0;
      font-size: 1.2rem;
      color: #333;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      margin-top: 1rem;
    }

    .calendar-day {
      padding: 10px;
      text-align: center;
      font-weight: bold;
      color: #666;
    }

    .calendar-day.active {
      background-color: #d1e7dd;
      color: #155724;
      border-radius: 6px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.8);
      }
      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }
  </style>
</head>
<body>
  <div class="calendar-popup">
    <h2>Calendar</h2>
    <div class="calendar-grid">
      <div>Mon</div>
      <div>Tue</div>
      <div>Wed</div>
