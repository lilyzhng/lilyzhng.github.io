<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photo Card Flip</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #f0f0f0;
    }
    .card {
      perspective: 1000px;
      width: 300px;
      height: 200px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s;
    }
    .card:hover {
      transform: rotateY(180deg);
    }
    .face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      overflow: hidden;
    }
    .face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;
      transition: transform 0.3s;
    }
    .card:hover .face img {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="face">
      <img src="https://via.placeholder.com/300x200" alt="Front" />
    </div>
    <div class="face">
      <img src="https://via.placeholder.com/300x200" alt="Back" />
    </div>
  </div>
</body>
</html>
