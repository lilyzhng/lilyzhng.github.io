<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photo Card Flip</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .card {
      perspective: 1000px;
      width: 300px;
      height: 200px;
      margin: 50px auto;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transform-style: preserve-3d;
      transition: transform 0.6s ease-in-out;
    }

    .card:hover {
      transform: rotateY(180deg);
    }

    .card .face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      overflow: hidden;
    }

    .card .front {
      background: url('https://picsum.photos/300/200') center/cover no-repeat;
    }

    .card .back {
      transform: rotateY(180deg);
      background: url('https://picsum.photos/301/201') center/cover no-repeat;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="face front"></div>
    <div class="face back"></div>
  </div>
</body>
</html>
