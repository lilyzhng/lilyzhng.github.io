<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Newsletter Signup</title>
  <style>
    /* Base styles */
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f8ff;
      color: #333;
    }

    /* Popup container */
    .popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #e6f7ff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      width: 90%;
      max-width: 360px;
      text-align: center;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.3s ease-in-out;
    }

    /* Close button */
    .popup .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #888;
      transition: color 0.3s;
    }

    .popup .close-btn:hover {
      color: #333;
    }

    /* Heading */
    .popup h2 {
      margin: 0 0 1rem 0;
      font-size: 1.5rem;
      color: #2c3e50;
    }

    /* Subtext */
    .popup p {
      margin: 0 0 1.5rem 0;
      font-size: 0.95rem;
      color: #555;
    }

    /* Form */
    .popup form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .popup input[type="email"] {
      padding: 0.75rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      width: 100%;
      box-sizing: border-box;
    }

    .popup button {
      padding: 0.75rem;
      background: #87ceeb;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
    }

    .popup button:hover {
      background: #6495ed;
    }

    /* Animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    /* Responsive adjustments */
    @media (max-width: 480px) {
      .popup {
        padding: 1.5rem;
      }

      .popup h2 {
        font-size: 1.25rem;
      }

      .popup p {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <div class="popup">
    <button class="close-btn" onclick="document.querySelector('.popup').style.display='none'">&times;</button>
    <h2>Subscribe to Our Newsletter</h2>
    <p>Stay updated with the latest news and offers.</p>
    <form onsubmit="return false;">
      <input type="email" placeholder="Enter your email" required />
      <button type="submit">Subscribe</button>
    </form>
  </div>
</body>
</html>
