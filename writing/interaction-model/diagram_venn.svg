<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340">
  <style>
    text { font-family: 'Georgia', serif; }
    .title { font-size: 15px; font-weight: bold; fill: #2a2218; }
    .item { font-size: 12px; fill: #5a5044; }
    .example { font-size: 11px; fill: #9a8e80; }
    .gap-label { font-size: 15px; font-weight: bold; fill: #2a2218; }
    .gap-sub { font-size: 11px; fill: #5a5044; }
    .annotation { font-size: 12px; fill: #7a7060; font-style: italic; }
  </style>

  <!-- Left circle: Full-Duplex -->
  <circle cx="270" cy="170" r="160" fill="#ede7db" fill-opacity="0.6" stroke="#c4b9a8" stroke-width="1.5"/>

  <!-- Right circle: Turn-Based -->
  <circle cx="530" cy="170" r="160" fill="#dde5d8" fill-opacity="0.6" stroke="#9aab8e" stroke-width="1.5"/>

  <!-- Left content -->
  <text x="210" y="110" text-anchor="middle" class="title">Full-Duplex</text>
  <text x="210" y="145" text-anchor="middle" class="item">Real-time interaction</text>
  <text x="210" y="167" text-anchor="middle" class="item">Simultaneous listen + speak</text>
  <text x="210" y="189" text-anchor="middle" class="item">Weak tool calling</text>
  <text x="210" y="225" text-anchor="middle" class="example">Moshi, GPT Voice, TML</text>

  <!-- Right content -->
  <text x="590" y="110" text-anchor="middle" class="title">Turn-Based</text>
  <text x="590" y="145" text-anchor="middle" class="item">Task completion</text>
  <text x="590" y="167" text-anchor="middle" class="item">Responds after request</text>
  <text x="590" y="189" text-anchor="middle" class="item">Strong tool calling</text>
  <text x="590" y="225" text-anchor="middle" class="example">ChatGPT, Claude, coding agents</text>

  <!-- Overlap: the gap -->
  <text x="400" y="158" text-anchor="middle" class="gap-label">?</text>
  <text x="400" y="178" text-anchor="middle" class="gap-sub">No product</text>
  <text x="400" y="193" text-anchor="middle" class="gap-sub">lives here</text>
</svg>