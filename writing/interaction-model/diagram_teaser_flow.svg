<svg xmlns="http://www.w3.org/2000/svg" width="360" height="480" viewBox="0 0 360 480">
  <style>
    text { font-family: 'Georgia', serif; }
    .node { fill: #f7f3ec; stroke: #c4b9a8; stroke-width: 1.5; rx: 8; }
    .node-text { font-size: 12px; fill: #2a2218; text-anchor: middle; }
    .node-label { font-size: 9px; fill: #9a8e80; text-anchor: middle; text-transform: uppercase; letter-spacing: 0.5px; }
    .arrow { stroke: #c4b9a8; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#c4b9a8"/>
    </marker>
  </defs>

  <!-- Node 1: User request -->
  <rect x="40" y="20" width="280" height="56" class="node" rx="8"/>
  <text x="180" y="38" class="node-label">User</text>
  <text x="180" y="56" class="node-text">"Check the weather in SF</text>
  <text x="180" y="70" class="node-text">and suggest an outfit"</text>

  <!-- Arrow 1→2 -->
  <line x1="180" y1="76" x2="180" y2="110" class="arrow"/>

  <!-- Node 2: Walkie-Talkie agent -->
  <rect x="60" y="110" width="240" height="44" class="node" rx="8"/>
  <text x="180" y="128" class="node-label">Walkie-Talkie Agent</text>
  <text x="180" y="144" class="node-text">Parses intent, calls backend</text>

  <!-- Arrow 2→3 -->
  <line x1="180" y1="154" x2="180" y2="188" class="arrow"/>

  <!-- Node 3: Tool call -->
  <rect x="60" y="188" width="240" height="44" class="node" rx="8" style="fill: #ede7db;"/>
  <text x="180" y="206" class="node-label">Tool Call</text>
  <text x="180" y="222" class="node-text">get_weather("San Francisco")</text>

  <!-- Arrow 3→4 -->
  <line x1="180" y1="232" x2="180" y2="266" class="arrow"/>

  <!-- Node 4: Weather result -->
  <rect x="60" y="266" width="240" height="44" class="node" rx="8"/>
  <text x="180" y="284" class="node-label">Result</text>
  <text x="180" y="300" class="node-text">64°F, partly cloudy, light wind</text>

  <!-- Arrow 4→5a and 4→5b (fork) -->
  <line x1="120" y1="310" x2="120" y2="344" class="arrow"/>
  <line x1="240" y1="310" x2="240" y2="344" class="arrow"/>

  <!-- Node 5a: Generate UI -->
  <rect x="20" y="344" width="200" height="44" class="node" rx="8" style="fill: #dde5d8;"/>
  <text x="120" y="362" class="node-label">Generative UI</text>
  <text x="120" y="378" class="node-text">Renders weather + outfit</text>

  <!-- Node 5b: Voice response -->
  <rect x="240" y="344" width="110" height="44" class="node" rx="8" style="fill: #dde5d8;"/>
  <text x="295" y="362" class="node-label">Voice</text>
  <text x="295" y="378" class="node-text">Speaks result</text>

  <!-- Arrow 5a→6 -->
  <line x1="120" y1="388" x2="120" y2="422" class="arrow"/>
  <!-- Arrow 5b→6 -->
  <line x1="295" y1="388" x2="295" y2="410" stroke="#c4b9a8" stroke-width="1.5" fill="none"/>
  <line x1="295" y1="410" x2="180" y2="410" stroke="#c4b9a8" stroke-width="1.5" fill="none"/>
  <line x1="180" y1="410" x2="180" y2="422" class="arrow"/>

  <!-- Node 6: Live on screen -->
  <rect x="40" y="422" width="280" height="40" rx="8" style="fill: #2a2218;"/>
  <text x="180" y="447" font-size="12" fill="#f7f3ec" text-anchor="middle" font-family="Georgia">User sees UI + hears response live</text>

</svg>