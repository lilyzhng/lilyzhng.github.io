<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 360" font-family='ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Helvetica Neue", sans-serif' text-rendering="geometricPrecision">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#D97757"/>
    </marker>
  </defs>

  <!-- background ivory -->
  <rect width="1080" height="360" fill="#FAF9F5"/>

  <!-- ============ PANE 1: Manual FE (left, plain) ============ -->
  <g>
    <rect x="30" y="30" width="400" height="300" rx="12" fill="#FFFFFF" stroke="#D1CFC5" stroke-width="1.5"/>
    <!-- num badge -->
    <rect x="48" y="50" width="34" height="22" rx="6" fill="#E3DACC"/>
    <text x="65" y="65" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#141413">01</text>
    <!-- title -->
    <text x="92" y="67" font-family="ui-serif, Georgia, serif" font-size="19" fill="#141413">Manual FE</text>
    <!-- tag -->
    <text x="48" y="92" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#87867F" letter-spacing="0.5">HUMAN · ONE-OFF</text>

    <!-- code block -->
    <rect x="48" y="110" width="364" height="92" rx="8" fill="#F0EEE6" stroke="#D1CFC5"/>
    <text x="60" y="134" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#87867F"># expert hand-crafts</text>
    <text x="60" y="156" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#3D3D3A">ratio = a / b</text>
    <text x="60" y="178" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#3D3D3A">log_c = log(c + 1)</text>

    <!-- caps: ✗ -->
    <rect x="48" y="226" width="92" height="24" rx="6" fill="#F0EEE6" stroke="#D1CFC5"/>
    <text x="94" y="242" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#87867F">✗ scale</text>

    <rect x="148" y="226" width="100" height="24" rx="6" fill="#F0EEE6" stroke="#D1CFC5"/>
    <text x="198" y="242" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#87867F">✗ transfer</text>

    <rect x="256" y="226" width="100" height="24" rx="6" fill="#F0EEE6" stroke="#D1CFC5"/>
    <text x="306" y="242" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#87867F">✗ improve</text>
  </g>

  <!-- ============ PANE 2: Code, closed loop (right, clay highlighted) ============ -->
  <g>
    <!-- shadow + clay border -->
    <rect x="460" y="30" width="590" height="300" rx="12" fill="#FFFFFF" stroke="#D97757" stroke-width="1.8" filter="drop-shadow(0 8px 20px rgba(217,119,87,0.12))"/>
    <!-- num badge (clay filled) -->
    <rect x="478" y="50" width="34" height="22" rx="6" fill="#D97757"/>
    <text x="495" y="65" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#FFFFFF">02</text>
    <!-- title -->
    <text x="522" y="67" font-family="ui-serif, Georgia, serif" font-size="19" fill="#141413">Code, closed loop</text>
    <!-- tag -->
    <text x="478" y="92" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#D97757" letter-spacing="0.5">FEATURES ARE PROGRAMS</text>

    <!-- code block (dark) -->
    <rect x="478" y="110" width="554" height="74" rx="8" fill="#141413"/>
    <text x="490" y="134" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#87867F"># LLM writes feature as code</text>
    <text x="490" y="156" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D97757">def</text>
    <text x="518" y="156" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#E8E6DE"> f(row):</text>
    <text x="510" y="174" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D97757">    return</text>
    <text x="572" y="174" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#E8E6DE"> row.a / row.b</text>

    <!-- inline closed-loop SVG inside pane 2 -->
    <!-- generate -> execute -> score -> refine with loop back -->
    <text x="498" y="212" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#3D3D3A">generate</text>
    <text x="690" y="212" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#3D3D3A">execute</text>
    <text x="858" y="212" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#3D3D3A">score</text>
    <text x="976" y="212" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#D97757">refine</text>

    <!-- forward arrows -->
    <line x1="566" y1="208" x2="685" y2="208" stroke="#87867F" stroke-width="1.2" marker-end="url(#arr)"/>
    <line x1="752" y1="208" x2="853" y2="208" stroke="#87867F" stroke-width="1.2" marker-end="url(#arr)"/>
    <line x1="900" y1="208" x2="973" y2="208" stroke="#87867F" stroke-width="1.2" marker-end="url(#arr)"/>

    <!-- loop back arrow: refine -> generate -->
    <path d="M 1006 218 C 1006 254, 510 254, 510 218" fill="none" stroke="#D97757" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>

    <!-- caps: ✓ (clay tinted) -->
    <rect x="478" y="278" width="92" height="24" rx="6" fill="rgba(217,119,87,0.08)" stroke="rgba(217,119,87,0.4)"/>
    <text x="524" y="294" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#D97757">✓ scale</text>

    <rect x="578" y="278" width="100" height="24" rx="6" fill="rgba(217,119,87,0.08)" stroke="rgba(217,119,87,0.4)"/>
    <text x="628" y="294" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#D97757">✓ transfer</text>

    <rect x="686" y="278" width="100" height="24" rx="6" fill="rgba(217,119,87,0.08)" stroke="rgba(217,119,87,0.4)"/>
    <text x="736" y="294" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#D97757">✓ improve</text>
  </g>
</svg>
