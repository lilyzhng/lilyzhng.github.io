<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 348" width="100%" role="img" aria-label="444 trials classified at L1, the 372 verifier failures diagnosed at L2 by 7 detectors, then split into SFT for knowledge gaps and reward terms plus GRPO for decision failures">
  <defs>
    <marker id="t7-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#93a888"/>
    </marker>
    <marker id="t7-arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#8cc07a"/>
    </marker>
  </defs>

  <style>
    .eyebrow { font: 700 11px "Fragment Mono", ui-monospace, Menlo, monospace; fill: #FFFFFF; letter-spacing: 0.12em; }
    .lbl     { font: 500 11px "Fragment Mono", ui-monospace, Menlo, monospace; fill: #FFFFFF; }
    .lbl-blue { font: 600 12px "Fragment Mono", ui-monospace, Menlo, monospace; fill: #1e3a5c; }
    .lbl-blue-lt { font: 600 11px "Fragment Mono", ui-monospace, Menlo, monospace; fill: #7ba7e3; }
    .lbl-green { font: 600 11px "Fragment Mono", ui-monospace, Menlo, monospace; fill: #FFFFFF; }
    .chip-t  { font: 500 10px "Fragment Mono", ui-monospace, Menlo, monospace; fill: #FFFFFF; }
    .box-t   { font: 600 12px "Fragment Mono", ui-monospace, Menlo, monospace; fill: #FFFFFF; }
    .box-t-green { font: 600 12.5px "Fragment Mono", ui-monospace, Menlo, monospace; fill: #FFFFFF; }
    .chip    { fill: rgba(224,224,224,0.06); stroke: rgba(224,224,224,0.35); stroke-width: 1; }
    .zoom    { stroke: rgba(224,224,224,0.3); stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
    .edge    { stroke: #93a888; stroke-width: 1.2; fill: none; }
    .edge-green { stroke: #8cc07a; stroke-width: 1.6; fill: none; }
  </style>

  <!-- dark canvas, full bleed: matches the other figures, page CSS rounds the corners -->
  <rect x="0" y="0" width="960" height="348" fill="#1e2a1c"/>

  <!-- ===== L1: macro bar, 444 trials ===== -->
  <text class="eyebrow" x="40" y="34">L1 CLASSIFICATION</text>

  <rect x="40"    y="48" width="95.1"  height="34" fill="#8cc07a"/>
  <rect x="135.1" y="48" width="737.3" height="34" fill="#7ba7e3"/>
  <rect x="872.4" y="48" width="43.6"  height="34" fill="#b3a369"/>
  <rect x="916"   y="48" width="4"     height="34" fill="#93a888"/>

  <text class="lbl-blue" x="503" y="70" text-anchor="middle">verifier_fail · 372</text>
  <text class="lbl" x="40" y="100">pass 48</text>
  <text class="lbl" x="920" y="100" text-anchor="end">timeout 22 · infra 2</text>

  <!-- zoom leaders into the 372 -->
  <line class="zoom" x1="135.1" y1="82" x2="40"  y2="148"/>
  <line class="zoom" x1="872.4" y1="82" x2="920" y2="148"/>

  <!-- ===== L2: micro bar, 372 verifier failures ===== -->
  <text class="eyebrow" x="40" y="138">L2 DIAGNOSIS</text>

  <rect x="40" y="148" width="790.2" height="38" fill="rgba(123,167,227,0.12)" stroke="#7ba7e3" stroke-width="1"/>
  <rect x="830.2" y="148" width="89.8" height="38" fill="none" stroke="rgba(224,224,224,0.3)" stroke-width="1" stroke-dasharray="4 4"/>

  <rect class="chip" x="52"  y="157" width="116" height="20" rx="5"/>
  <rect class="chip" x="177" y="157" width="122" height="20" rx="5"/>
  <rect class="chip" x="308" y="157" width="80"  height="20" rx="5"/>
  <rect class="chip" x="397" y="157" width="80"  height="20" rx="5"/>
  <rect class="chip" x="486" y="157" width="80"  height="20" rx="5"/>
  <rect class="chip" x="575" y="157" width="110" height="20" rx="5"/>
  <rect class="chip" x="694" y="157" width="74"  height="20" rx="5"/>

  <text class="chip-t" x="110" y="171" text-anchor="middle">error_unaddressed</text>
  <text class="chip-t" x="238" y="171" text-anchor="middle">premature_complete</text>
  <text class="chip-t" x="348" y="171" text-anchor="middle">repeat_loop</text>
  <text class="chip-t" x="437" y="171" text-anchor="middle">wasted_cmds</text>
  <text class="chip-t" x="526" y="171" text-anchor="middle">missing_env</text>
  <text class="chip-t" x="630" y="171" text-anchor="middle">context_pressure</text>
  <text class="chip-t" x="731" y="171" text-anchor="middle">json_parse</text>

  <text class="lbl-blue-lt" x="44" y="200">diagnosed 334</text>
  <text class="lbl" x="875" y="172" text-anchor="middle">silent 38</text>

  <!-- ===== Train: split by failure type ===== -->
  <text class="eyebrow" x="40" y="232">TRAIN</text>

  <text class="lbl" x="422" y="261" text-anchor="end">missing_env · json_parse</text>
  <line class="edge" x1="430" y1="257" x2="452" y2="257" marker-end="url(#t7-arr)"/>
  <rect x="460" y="242" width="150" height="30" rx="7" fill="rgba(224,224,224,0.06)" stroke="rgba(224,224,224,0.45)" stroke-width="1"/>
  <text class="box-t" x="535" y="261" text-anchor="middle">SFT cold start</text>

  <text class="lbl-green" x="422" y="307" text-anchor="end">premature_complete · error_unaddressed · loops</text>
  <line class="edge-green" x1="430" y1="303" x2="452" y2="303" marker-end="url(#t7-arr-green)"/>
  <rect x="460" y="288" width="150" height="30" rx="7" fill="rgba(140,192,122,0.12)" stroke="#8cc07a" stroke-width="1.6"/>
  <text class="box-t-green" x="535" y="307" text-anchor="middle">reward terms</text>

  <path class="edge" d="M 610 257 C 672 257, 700 262, 768 268" marker-end="url(#t7-arr)"/>
  <path class="edge-green" d="M 610 303 C 672 303, 700 282, 768 276" marker-end="url(#t7-arr-green)"/>

  <rect x="776" y="254" width="144" height="36" rx="7" fill="#8cc07a"/>
  <text x="848" y="276" text-anchor="middle" style="font: 700 13px 'Fragment Mono', ui-monospace, Menlo, monospace; fill: #1e2a1c;">GRPO</text>
</svg>
