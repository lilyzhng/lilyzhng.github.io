<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 312" width="100%" role="img" aria-label="444 trials classified at L1, the 372 verifier failures diagnosed at L2 by 7 detectors, then split into SFT for knowledge gaps and reward terms plus GRPO for decision failures">
  <defs>
    <marker id="t4-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#87867F"/>
    </marker>
    <marker id="t4-arr-forest" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2D5A3D"/>
    </marker>
  </defs>

  <style>
    .eyebrow { font: 700 11px "Fragment Mono", ui-monospace, Menlo, monospace; fill: #17450C; letter-spacing: 0.12em; }
    .lbl     { font: 500 11px "Fragment Mono", ui-monospace, Menlo, monospace; fill: #6b6a63; }
    .lbl-ink { font: 600 12px "Fragment Mono", ui-monospace, Menlo, monospace; fill: #FFFFFF; }
    .lbl-forest { font: 600 11px "Fragment Mono", ui-monospace, Menlo, monospace; fill: #17450C; }
    .chip-t  { font: 500 10px "Fragment Mono", ui-monospace, Menlo, monospace; fill: #2a3a28; }
    .box-t   { font: 600 12px "Fragment Mono", ui-monospace, Menlo, monospace; fill: #2a3a28; }
    .box-t-forest { font: 600 12.5px "Fragment Mono", ui-monospace, Menlo, monospace; fill: #17450C; }
    .chip    { fill: #FFFFFF; stroke: #D1CFC5; stroke-width: 1; }
    .zoom    { stroke: #B9B7AD; stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
    .edge    { stroke: #87867F; stroke-width: 1.2; fill: none; }
    .edge-forest { stroke: #2D5A3D; stroke-width: 1.6; fill: none; }
  </style>

  <!-- ===== L1: macro bar, 444 trials ===== -->
  <text class="eyebrow" x="40" y="24">L1 CLASSIFY · 444 TRIALS · GPT-OSS-20B BASELINE · HARBOR</text>

  <rect x="40"    y="38" width="41.6"  height="34" fill="#2D5A3D"/>
  <rect x="81.6"  y="38" width="737.3" height="34" fill="#D97757"/>
  <rect x="818.9" y="38" width="91.2"  height="34" fill="#D1CFC5"/>
  <rect x="910.1" y="38" width="9.9"   height="34" fill="#A8A69C"/>

  <text class="lbl-ink" x="450" y="60" text-anchor="middle">verifier_fail · 372</text>
  <text class="lbl" x="40" y="90">pass 21</text>
  <text class="lbl" x="920" y="90" text-anchor="end">timeout 46 · infra 5</text>

  <!-- zoom leaders into the 372 -->
  <line class="zoom" x1="81.6"  y1="72" x2="40"  y2="138"/>
  <line class="zoom" x1="818.9" y1="72" x2="920" y2="138"/>

  <!-- ===== L2: micro bar, 372 verifier failures ===== -->
  <text class="eyebrow" x="40" y="128">L2 DIAGNOSE · 7 EXECUTABLE DETECTORS · RULE-BASED, NO LLM</text>

  <rect x="40" y="138" width="790.2" height="38" fill="#EDF3EE" stroke="#2D5A3D" stroke-width="1"/>
  <rect x="830.2" y="138" width="89.8" height="38" fill="none" stroke="#B9B7AD" stroke-width="1" stroke-dasharray="4 4"/>

  <rect class="chip" x="52"  y="147" width="116" height="20" rx="5"/>
  <rect class="chip" x="177" y="147" width="122" height="20" rx="5"/>
  <rect class="chip" x="308" y="147" width="80"  height="20" rx="5"/>
  <rect class="chip" x="397" y="147" width="80"  height="20" rx="5"/>
  <rect class="chip" x="486" y="147" width="80"  height="20" rx="5"/>
  <rect class="chip" x="575" y="147" width="110" height="20" rx="5"/>
  <rect class="chip" x="694" y="147" width="74"  height="20" rx="5"/>

  <text class="chip-t" x="110" y="161" text-anchor="middle">error_unaddressed</text>
  <text class="chip-t" x="238" y="161" text-anchor="middle">premature_complete</text>
  <text class="chip-t" x="348" y="161" text-anchor="middle">repeat_loop</text>
  <text class="chip-t" x="437" y="161" text-anchor="middle">wasted_cmds</text>
  <text class="chip-t" x="526" y="161" text-anchor="middle">missing_env</text>
  <text class="chip-t" x="630" y="161" text-anchor="middle">context_pressure</text>
  <text class="chip-t" x="731" y="161" text-anchor="middle">json_parse</text>

  <text class="lbl-forest" x="44" y="190">diagnosed 334</text>
  <text class="lbl" x="875" y="162" text-anchor="middle">silent 38</text>

  <!-- ===== Train: split by failure type ===== -->
  <text class="eyebrow" x="40" y="222">TRAIN · SPLIT BY FAILURE TYPE</text>

  <text class="lbl" x="422" y="251" text-anchor="end">missing_env · json_parse</text>
  <line class="edge" x1="430" y1="247" x2="452" y2="247" marker-end="url(#t4-arr)"/>
  <rect x="460" y="232" width="150" height="30" rx="7" fill="#FFFFFF" stroke="#D1CFC5" stroke-width="1"/>
  <text class="box-t" x="535" y="251" text-anchor="middle">SFT cold start</text>

  <text class="lbl-forest" x="422" y="297" text-anchor="end">premature_complete · error_unaddressed · loops</text>
  <line class="edge-forest" x1="430" y1="293" x2="452" y2="293" marker-end="url(#t4-arr-forest)"/>
  <rect x="460" y="278" width="150" height="30" rx="7" fill="#EDF3EE" stroke="#2D5A3D" stroke-width="1.6"/>
  <text class="box-t-forest" x="535" y="297" text-anchor="middle">reward terms</text>

  <path class="edge" d="M 610 247 C 672 247, 700 252, 768 258" marker-end="url(#t4-arr)"/>
  <path class="edge-forest" d="M 610 293 C 672 293, 700 272, 768 266" marker-end="url(#t4-arr-forest)"/>

  <rect x="776" y="244" width="144" height="36" rx="7" fill="#2D5A3D"/>
  <text x="848" y="266" text-anchor="middle" style="font: 700 13px 'Fragment Mono', ui-monospace, Menlo, monospace; fill: #FFFFFF;">GRPO</text>
</svg>
