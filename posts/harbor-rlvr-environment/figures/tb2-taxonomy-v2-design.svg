<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" role="img" aria-label="Failure taxonomy v2: rollouts, L1 coarse attribution, L2 fine diagnosis, diagnosed vs silent, improvement queue with exits A and B">
  <defs>
    <marker id="tx10-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#93a888"/>
    </marker>
  </defs>
  <style>
    .eyebrow { font: 700 11px "Fragment Mono", ui-monospace, Menlo, monospace; fill: #FFFFFF; letter-spacing: 0.1em; }
    .t   { font: 600 12.5px "Fragment Mono", ui-monospace, Menlo, monospace; fill: #2a3a28; }
    .s   { font: 500 9.5px "Fragment Mono", ui-monospace, Menlo, monospace; fill: #87867F; }
    .chip-t { font: 500 10px "Fragment Mono", ui-monospace, Menlo, monospace; fill: #2a3a28; }
    .edge { stroke: #93a888; stroke-width: 1.2; fill: none; }
    .edge-dash { stroke: rgba(224,224,224,0.5); stroke-width: 1.1; stroke-dasharray: 4 4; fill: none; }
    .box  { fill: #FFFFFF; stroke: #C9C7BD; stroke-width: 1; }
  </style>

  <rect x="0" y="0" width="960" height="560" fill="#1e2a1c"/>

  <!-- rollouts -->
  <rect class="box" x="370" y="36" width="220" height="36" rx="7"/>
  <text class="t" x="480" y="59" text-anchor="middle">Harbor rollouts</text>
  <line class="edge" x1="480" y1="72" x2="480" y2="94"/>
  <line class="edge" x1="135" y1="94" x2="795" y2="94"/>
  <line class="edge" x1="135" y1="94" x2="135" y2="122" marker-end="url(#tx10-arr)"/>
  <line class="edge" x1="345" y1="94" x2="345" y2="122" marker-end="url(#tx10-arr)"/>
  <line class="edge" x1="555" y1="94" x2="555" y2="122" marker-end="url(#tx10-arr)"/>
  <line class="edge" x1="795" y1="94" x2="795" y2="122" marker-end="url(#tx10-arr)"/>

  <!-- L1 -->
  <text class="eyebrow" x="40" y="114">L1 · COARSE ATTRIBUTION</text>
  <rect x="40"  y="126" width="190" height="44" rx="7" fill="#EDF3EE" stroke="#2D5A3D" stroke-width="1.2"/>
  <text class="t" x="135" y="145" text-anchor="middle">pass</text>
  <text class="s" x="135" y="161" text-anchor="middle">agent got it right</text>

  <rect x="250" y="126" width="190" height="44" rx="7" fill="#EAF1FB" stroke="#5b8fd4" stroke-width="1.2"/>
  <text class="t" x="345" y="145" text-anchor="middle">verifier_fail</text>
  <text class="s" x="345" y="161" text-anchor="middle">agent got it wrong</text>

  <rect x="460" y="126" width="190" height="44" rx="7" fill="#FBF3E0" stroke="#b3893a" stroke-width="1.2"/>
  <text class="t" x="555" y="145" text-anchor="middle">timeout</text>
  <text class="s" x="555" y="161" text-anchor="middle">unfinished · deferred</text>

  <rect x="670" y="126" width="250" height="44" rx="7" fill="#FFFFFF" stroke="#9a988e" stroke-dasharray="5 4"/>
  <text class="t" x="795" y="145" text-anchor="middle">infra · unscored</text>
  <text class="s" x="795" y="161" text-anchor="middle">external · not attributable</text>

  <!-- quarantine -->
  <line class="edge" x1="795" y1="170" x2="795" y2="196" marker-end="url(#tx10-arr)"/>
  <rect x="670" y="200" width="250" height="42" rx="7" fill="#FFFFFF" stroke="#9a988e" stroke-dasharray="5 4"/>
  <text class="t" x="795" y="218" text-anchor="middle">quarantine</text>
  <text class="s" x="795" y="234" text-anchor="middle">count &amp; report · don't chase</text>

  <!-- into L2 -->
  <line class="edge" x1="135" y1="170" x2="135" y2="266" marker-end="url(#tx10-arr)"/>
  <line class="edge" x1="345" y1="170" x2="345" y2="266" marker-end="url(#tx10-arr)"/>
  <line class="edge" x1="555" y1="170" x2="555" y2="266" marker-end="url(#tx10-arr)"/>
  <text class="s" x="145" y="226" style="fill:#cfd6cb">efficiency + control group</text>

  <!-- L2 -->
  <text class="eyebrow" x="40" y="256">L2 · FINE DIAGNOSIS</text>
  <rect x="40" y="268" width="610" height="52" rx="7" fill="#EDF3EE" stroke="#2D5A3D" stroke-width="1.6"/>
  <text class="t" x="345" y="290" text-anchor="middle">executable detectors over every trace</text>
  <text class="s" x="345" y="308" text-anchor="middle">multi-label · N/A ≠ 0 · $0</text>

  <!-- outcomes -->
  <line class="edge" x1="200" y1="320" x2="200" y2="348" marker-end="url(#tx10-arr)"/>
  <line class="edge" x1="500" y1="320" x2="500" y2="348" marker-end="url(#tx10-arr)"/>

  <rect x="40" y="352" width="320" height="60" rx="7" fill="#EDF3EE" stroke="#2D5A3D" stroke-width="1.2"/>
  <text class="t" x="200" y="376" text-anchor="middle">diagnosed · a detector fired</text>
  <text class="s" x="200" y="394" text-anchor="middle">lethal modes → reward · rest → env / data</text>

  <rect x="400" y="352" width="250" height="60" rx="7" fill="#FFFFFF" stroke="#9a988e" stroke-dasharray="5 4"/>
  <text class="t" x="525" y="376" text-anchor="middle">silent · nothing fired</text>
  <text class="s" x="525" y="394" text-anchor="middle">failed, cause unseen</text>

  <!-- improvement queue -->
  <line class="edge" x1="525" y1="412" x2="525" y2="440" marker-end="url(#tx10-arr)"/>
  <rect class="box" x="290" y="444" width="470" height="78" rx="7"/>
  <text class="t" x="525" y="466" text-anchor="middle">improvement queue</text>
  <rect x="308" y="480" width="196" height="26" rx="6" fill="#EDF3EE" stroke="#2D5A3D"/>
  <text class="chip-t" x="406" y="497" text-anchor="middle">A · new detector → L2</text>
  <rect x="520" y="480" width="222" height="26" rx="6" fill="#FFFFFF" stroke="#9a988e" stroke-dasharray="4 3"/>
  <text class="chip-t" x="631" y="497" text-anchor="middle">B · new quarantine rule → L1</text>
  <path class="edge-dash" d="M 306 493 L 28 493 L 28 294 L 34 294" marker-end="url(#tx10-arr)"/>
  <path class="edge-dash" d="M 742 493 L 850 493 L 850 248" marker-end="url(#tx10-arr)"/>
</svg>
