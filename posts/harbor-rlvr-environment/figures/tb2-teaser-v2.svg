<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" width="100%" role="img" aria-label="Method pipeline: rollouts, L1 classify, L2 diagnose, then knowledge gaps go to SFT and decision failures become reward terms, both feeding GRPO training">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="rgba(0,0,0,0.45)"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3f6f37"/>
    </marker>
  </defs>

  <style>
    .title { font: 600 14.5px Inter, system-ui, -apple-system, sans-serif; fill: rgba(0,0,0,0.86); }
    .sub   { font: 400 11px "Fragment Mono", ui-monospace, Menlo, monospace; fill: rgba(0,0,0,0.55); }
    .ref   { font: 400 10.5px "Fragment Mono", ui-monospace, Menlo, monospace; fill: rgba(0,0,0,0.38); }
    .bridge{ font: 500 11.5px "Fragment Mono", ui-monospace, Menlo, monospace; fill: #3f6f37; }
    .box   { fill: #fffffb; stroke: rgba(0,0,0,0.22); stroke-width: 1; }
    .box-accent { fill: #fffffb; stroke: #3f6f37; stroke-width: 1.6; }
    .edge  { stroke: rgba(0,0,0,0.45); stroke-width: 1.3; fill: none; }
    .edge-green { stroke: #3f6f37; stroke-width: 1.8; fill: none; }
  </style>

  <!-- main row boxes -->
  <rect class="box" x="8"   y="108" width="168" height="84" rx="8"/>
  <rect class="box" x="214" y="108" width="168" height="84" rx="8"/>
  <rect class="box" x="420" y="108" width="168" height="84" rx="8"/>
  <rect class="box" x="832" y="108" width="168" height="84" rx="8"/>

  <!-- branch boxes -->
  <rect class="box" x="626" y="20" width="168" height="84" rx="8"/>
  <rect class="box-accent" x="626" y="196" width="168" height="84" rx="8"/>

  <!-- box 1: rollouts -->
  <text class="title" x="92" y="138" text-anchor="middle">444 rollouts</text>
  <text class="sub" x="92" y="159" text-anchor="middle">Harbor · terminus-2</text>
  <text class="sub" x="92" y="176" text-anchor="middle">gpt-oss-20b baseline</text>

  <!-- box 2: L1 -->
  <text class="title" x="298" y="138" text-anchor="middle">L1 classify</text>
  <text class="sub" x="298" y="159" text-anchor="middle">rule-based, no LLM</text>
  <text class="sub" x="298" y="176" text-anchor="middle">verifier_fail: 372</text>

  <!-- box 3: L2 -->
  <text class="title" x="504" y="138" text-anchor="middle">L2 diagnose</text>
  <text class="sub" x="504" y="159" text-anchor="middle">7 executable detectors</text>
  <text class="sub" x="504" y="176" text-anchor="middle">334 diagnosed · 38 silent</text>

  <!-- box 4a: SFT branch -->
  <text class="title" x="710" y="50" text-anchor="middle">SFT cold start</text>
  <text class="sub" x="710" y="71" text-anchor="middle">"doesn't know the move"</text>
  <text class="sub" x="710" y="88" text-anchor="middle">missing_env · malformed JSON</text>

  <!-- box 4b: reward branch (the contribution) -->
  <text class="title" x="710" y="226" text-anchor="middle">Reward terms</text>
  <text class="sub" x="710" y="247" text-anchor="middle">"decides badly"</text>
  <text class="sub" x="710" y="264" text-anchor="middle">early submit · loops</text>

  <!-- box 5: GRPO -->
  <text class="title" x="916" y="138" text-anchor="middle">GRPO training</text>
  <text class="sub" x="916" y="159" text-anchor="middle">from the SFT checkpoint</text>
  <text class="sub" x="916" y="176" text-anchor="middle">TRL + Harbor on Modal</text>

  <!-- edges: main row -->
  <line class="edge" x1="180" y1="150" x2="206" y2="150" marker-end="url(#arr)"/>
  <line class="edge" x1="386" y1="150" x2="412" y2="150" marker-end="url(#arr)"/>

  <!-- fork: L2 to SFT (top) and reward terms (bottom) -->
  <path class="edge" d="M 592 130 C 608 130, 602 62, 618 62" marker-end="url(#arr)"/>
  <path class="edge-green" d="M 592 170 C 608 170, 602 238, 618 238" marker-end="url(#arr-green)"/>

  <!-- merge: SFT and reward terms into GRPO -->
  <path class="edge" d="M 798 62 C 814 62, 808 130, 824 130" marker-end="url(#arr)"/>
  <path class="edge-green" d="M 798 238 C 814 238, 808 170, 824 170" marker-end="url(#arr-green)"/>

  <!-- the claim -->
  <text class="bridge" x="710" y="186" text-anchor="middle">detections become rewards</text>

  <!-- section refs -->
  <text class="ref" x="92"  y="212" text-anchor="middle">§2</text>
  <text class="ref" x="298" y="212" text-anchor="middle">§2.1</text>
  <text class="ref" x="504" y="212" text-anchor="middle">§2.2</text>
  <text class="ref" x="710" y="120" text-anchor="middle">§4.3</text>
  <text class="ref" x="710" y="296" text-anchor="middle">§3.3</text>
  <text class="ref" x="916" y="212" text-anchor="middle">§4</text>
</svg>
