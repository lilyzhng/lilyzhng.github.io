<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" width="800" height="530">
  <style>
    .arrow-path { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2.5; }
    .arrow-blue { stroke: rgba(0, 174, 239, 0.38); }
    .arrow-green { stroke: rgba(169, 216, 79, 0.38); }
    .arrowhead-blue { fill: none; stroke: rgba(0, 174, 239, 0.38); stroke-linecap: round; stroke-linejoin: round; stroke-width: 2.5; }
    .arrowhead-green { fill: none; stroke: rgba(169, 216, 79, 0.38); stroke-linecap: round; stroke-linejoin: round; stroke-width: 2.5; }
    .motion-route { fill: none; opacity: 0; pointer-events: none; }
    .spark-pill-blue { fill: #00AEEF; opacity: 0.36; filter: blur(0.5px); }
    .spark-pill-green { fill: #A9D84F; opacity: 0.36; filter: blur(0.5px); }
    .node-box { fill: #FAFAF8; stroke: #E0DDD8; stroke-width: 1.4; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.06)); }
    .node-text { font-family: 'Georgia', serif; font-size: 15px; fill: #2C2825; text-anchor: middle; }
    .label-text { font-family: 'Georgia', serif; font-size: 12px; fill: #8A837A; }
    .realtime-border { fill: none; stroke: #C8C4BC; stroke-width: 1.4; stroke-dasharray: 6,4; }
    .realtime-label { font-family: 'Georgia', serif; font-size: 12px; fill: #8A837A; }
    .caption { font-family: 'Georgia', serif; font-size: 12px; fill: #8A837A; text-anchor: middle; font-style: italic; }
  </style>

  <!-- Background -->
  <rect width="800" height="530" rx="12" fill="#F5F3EF"/>

  <!-- Real-time dashed border -->
  <rect x="55" y="230" width="340" height="228" rx="14" class="realtime-border"/>
  <text x="225" y="452" text-anchor="middle" class="realtime-label">real-time</text>

  <!-- === ARROW PATHS === -->

  <!-- User -> OpenAI Realtime (top, blue) -->
  <path d="M 150 370 V 310 Q 150 276 180 276 H 228" class="arrow-path arrow-blue"/>
  <path d="M 218 266 L 230 276 L 218 286" class="arrowhead-blue"/>

  <!-- OpenAI Realtime -> User (bottom, blue) -->
  <path d="M 303 304 V 380 Q 303 400 275 400 H 225" class="arrow-path arrow-blue"/>
  <path d="M 235 390 L 223 400 L 235 410" class="arrowhead-blue"/>

  <!-- OpenAI Realtime -> Claude Code (top, green: task) -->
  <path d="M 303 240 V 155 Q 303 130 328 130 H 440" class="arrow-path arrow-green"/>
  <path d="M 428 120 L 440 130 L 428 140" class="arrowhead-green"/>

  <!-- Claude Code -> OpenAI Realtime (bottom, green: response) -->
  <path d="M 520 175 V 268 Q 520 285 495 285 H 383" class="arrow-path arrow-green"/>
  <path d="M 395 275 L 383 285 L 395 295" class="arrowhead-green"/>

  <!-- Claude Code -> Tools loop (top arc) -->
  <path d="M 520 95 V 55 Q 520 35 545 35 H 630 Q 650 35 650 55 V 115 Q 650 130 630 130 H 600" class="arrow-path arrow-green"/>
  <path d="M 612 120 L 600 130 L 612 140" class="arrowhead-green"/>

  <!-- === MOTION ROUTES === -->
  <path id="wt-rt-loop" d="M 150 370 V 310 Q 150 276 180 276 H 228 L 303 276 V 304 V 380 Q 303 400 275 400 H 225 L 150 400 V 370" class="motion-route"/>
  <path id="wt-bg-loop" d="M 303 240 V 155 Q 303 130 328 130 H 440 L 480 130 H 520 V 95 V 55 Q 520 35 545 35 H 630 Q 650 35 650 55 V 115 Q 650 130 630 130 H 600 L 555 130 H 520 V 175 V 268 Q 520 285 495 285 H 383 L 303 285 V 240" class="motion-route"/>

  <!-- === ANIMATED SPARKS === -->
  <g>
    <rect class="spark-pill-blue" x="-14" y="-4" width="28" height="8" rx="4"/>
    <animateMotion dur="1.6s" repeatCount="indefinite" rotate="auto">
      <mpath href="#wt-rt-loop"/>
    </animateMotion>
  </g>
  <g>
    <rect class="spark-pill-blue" x="-14" y="-4" width="28" height="8" rx="4"/>
    <animateMotion dur="1.6s" begin="-0.8s" repeatCount="indefinite" rotate="auto">
      <mpath href="#wt-rt-loop"/>
    </animateMotion>
  </g>
  <g>
    <rect class="spark-pill-green" x="-14" y="-4" width="28" height="8" rx="4"/>
    <animateMotion dur="4.2s" begin="-1.1s" repeatCount="indefinite" rotate="auto">
      <mpath href="#wt-bg-loop"/>
    </animateMotion>
  </g>

  <!-- === NODES === -->

  <!-- User -->
  <rect x="78" y="372" width="145" height="56" rx="8" class="node-box"/>
  <text x="150" y="405" class="node-text">user</text>

  <!-- OpenAI Realtime -->
  <rect x="230" y="248" width="145" height="56" rx="8" class="node-box" style="stroke: rgba(0,174,239,0.3);"/>
  <text x="303" y="271" class="node-text">OpenAI</text>
  <text x="303" y="289" class="node-text">Realtime</text>

  <!-- Claude Code -->
  <rect x="448" y="100" width="145" height="56" rx="8" class="node-box" style="stroke: rgba(169,216,79,0.3);"/>
  <text x="520" y="133" class="node-text">Claude Code</text>

  <!-- === LABELS === -->
  <text x="375" y="122" class="label-text" text-anchor="middle">task</text>
  <text x="450" y="278" class="label-text" text-anchor="middle">response</text>
  <text x="665" y="52" class="label-text">tool calls</text>
  <text x="665" y="68" class="label-text">search</text>
  <text x="665" y="84" class="label-text" style="font-style: italic;">generative UI</text>

  <!-- Caption -->
  <text x="400" y="498" class="caption">The user interacts with OpenAI Realtime in real time. Claude Code handles</text>
  <text x="400" y="516" class="caption">tool calls, search, and generative UI asynchronously.</text>
</svg>