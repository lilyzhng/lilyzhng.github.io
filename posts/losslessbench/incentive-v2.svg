<svg viewBox="60 16 680 520" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Incentive pressure funnel: model company, inference provider and application layer stack their weight downward; the user is squeezed into a small box at the bottom."><defs><marker id="parr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#55554f"/></marker></defs><rect x="80.0" y="28" width="640" height="86" rx="8" fill="#1f5c3d"/><text x="400" y="65.0" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="17.5" font-weight="600" fill="#ffffff">Model company</text><text x="400" y="88.0" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13.5" fill="#ffffff" fill-opacity="0.82">wants distribution + revenue</text><polygon points="80.0,114 720.0,114 660.0,140 140.0,140" fill="#3c7a58" fill-opacity="0.12"/><rect x="140.0" y="140" width="520" height="80" rx="8" fill="#3c7a58"/><text x="400" y="174.0" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="17.5" font-weight="600" fill="#ffffff">Inference provider</text><text x="400" y="197.0" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13.5" fill="#ffffff" fill-opacity="0.82">wants speed, token volume, token maxxing</text><polygon points="140.0,220 660.0,220 600.0,246 200.0,246" fill="#a9c4b2" fill-opacity="0.12"/><rect x="200.0" y="246" width="400" height="74" rx="8" fill="#a9c4b2"/><text x="400" y="277.0" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="17.5" font-weight="600" fill="#1a1a19">Application layer</text><text x="400" y="300.0" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13.5" fill="#1a1a19" fill-opacity="0.82">buys whatever is fast, cheap, functional</text><line x1="230" y1="330" x2="330" y2="372" stroke="#55554f" stroke-width="2.4" marker-end="url(#parr)"/><line x1="400" y1="330" x2="400" y2="372" stroke="#55554f" stroke-width="2.4" marker-end="url(#parr)"/><line x1="570" y1="330" x2="470" y2="372" stroke="#55554f" stroke-width="2.4" marker-end="url(#parr)"/><rect x="305" y="380" width="190" height="40" rx="6" fill="#fdf0f5" stroke="#d6437c" stroke-width="2.2"/><text x="400" y="406" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="700" fill="#d6437c">User</text><text x="275" y="407" font-family="Inter,system-ui,sans-serif" font-size="20" font-weight="700" fill="#d6437c">&#187;</text><text x="507" y="407" font-family="Inter,system-ui,sans-serif" font-size="20" font-weight="700" fill="#d6437c">&#171;</text><text x="400" y="448" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13.5" fill="#8a8a84">receives whatever comes out, bears the quality loss</text></svg>