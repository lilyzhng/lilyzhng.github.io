<svg viewBox="40 10 640 330" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Quality loss comparison. GLM 5.2 with vendor-owned acceleration loses 5.6 points. Kimi K3 with model-owned acceleration loses 0.3 points.">
  <line x1="120" y1="60" x2="120" y2="260" stroke="#e7e7e2" stroke-width="1"/>
  <line x1="120" y1="60" x2="640" y2="60" stroke="#e7e7e2" stroke-width="1"/>
  <text x="112" y="64" text-anchor="end" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#8a8a84">0</text>
  <rect x="120" y="60" width="470" height="70" fill="#d6437c" fill-opacity="0.14"/>
  <rect x="120" y="60" width="470" height="70" fill="none"/>
  <rect x="120" y="74" width="470" height="42" fill="#d6437c"/>
