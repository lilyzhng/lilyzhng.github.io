  <text x="120" y="172" font-family="Inter,system-ui,sans-serif" font-size="15.5" font-weight="600" fill="#1a1a19">Kimi K3, acceleration owned by the model</text>
  <text x="120" y="250" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#8a8a84">frontend quality loss vs each model's reference endpoint, same prompts, same judge</text>
  <text x="332" y="215" font-family="Inter,system-ui,sans-serif" font-size="13.5" fill="#8a8a84">7 of 10 prompts score exactly identical</text>
