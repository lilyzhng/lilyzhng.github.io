<svg viewBox="40 20 800 480" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Incentive map: model company, inference provider, application layer, then the user who bears the cost. Speed is visible on every dashboard; quality is measured by no one."><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#9a9a94"/></marker></defs><rect x="60" y="40" width="400" height="74" rx="10" fill="#ffffff" stroke="#d8d8d2" stroke-width="1.4"/><text x="82" y="71" font-family="Inter,system-ui,sans-serif" font-size="16.5" font-weight="600" fill="#1a1a19">Model company</text><text x="82" y="94" font-family="Inter,system-ui,sans-serif" font-size="13.5" fill="#8a8a84">wants distribution + revenue</text><line x1="260.0" y1="114" x2="260.0" y2="142" stroke="#9a9a94" stroke-width="1.6" marker-end="url(#arr)"/><rect x="60" y="148" width="400" height="74" rx="10" fill="#ffffff" stroke="#d8d8d2" stroke-width="1.4"/><text x="82" y="179" font-family="Inter,system-ui,sans-serif" font-size="16.5" font-weight="600" fill="#1a1a19">Inference provider</text><text x="82" y="202" font-family="Inter,system-ui,sans-serif" font-size="13.5" fill="#8a8a84">wants speed, token volume, token maxxing</text><line x1="260.0" y1="222" x2="260.0" y2="250" stroke="#9a9a94" stroke-width="1.6" marker-end="url(#arr)"/><rect x="60" y="256" width="400" height="74" rx="10" fill="#ffffff" stroke="#d8d8d2" stroke-width="1.4"/><text x="82" y="287" font-family="Inter,system-ui,sans-serif" font-size="16.5" font-weight="600" fill="#1a1a19">Application layer</text><text x="82" y="310" font-family="Inter,system-ui,sans-serif" font-size="13.5" fill="#8a8a84">buys whatever is fast, cheap, functional</text><line x1="260.0" y1="330" x2="260.0" y2="358" stroke="#9a9a94" stroke-width="1.6" marker-end="url(#arr)"/><rect x="60" y="364" width="400" height="74" rx="10" fill="#fdf0f5" stroke="#d6437c" stroke-width="2"/><text x="82" y="395" font-family="Inter,system-ui,sans-serif" font-size="16.5" font-weight="600" fill="#d6437c">User</text><text x="82" y="418" font-family="Inter,system-ui,sans-serif" font-size="13.5" fill="#8a8a84">receives whatever comes out, bears the cost</text><text x="580" y="52" font-family="Inter,system-ui,sans-serif" font-size="14.5" font-weight="600" fill="#1f5c3d">speed</text><text x="580" y="71" font-family="Inter,system-ui,sans-serif" font-size="12.5" fill="#8a8a84">on every dashboard</text><line x1="584" y1="86" x2="584" y2="438" stroke="#1f5c3d" stroke-width="2.2"/><text x="700" y="52" font-family="Inter,system-ui,sans-serif" font-size="14.5" font-weight="600" fill="#8a8a84">quality</text><text x="700" y="71" font-family="Inter,system-ui,sans-serif" font-size="12.5" fill="#8a8a84">measured by no one</text><line x1="704" y1="86" x2="704" y2="438" stroke="#b9b9b2" stroke-width="2" stroke-dasharray="3 6"/></svg>