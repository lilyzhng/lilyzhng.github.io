    <!-- Metadata, OpenGraph and Schema.org -->
    {% include metadata.html %}

    <!-- NOTE: bootstrap / mdbootstrap / bootstrap-table / fontawesome / academicons
         CDN links removed. Their version vars (site.bootstrap.version, etc.) were
         never set in _config.yml, so these URLs rendered as "…@/…" and always 404'd
         (MIME errors in console). Font Awesome + Academicons are loaded via main.css
         (@import, versioned), so icons are unaffected. -->

    <!-- Fonts -->
    <link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Roboto+Slab:100,300,400,500,700|Material+Icons">

    <!-- Code Syntax Highlighting: removed. site.highlight_theme_light was never set,
         so this rendered as ".../jekyll-pygments-themes@master/.css" and HUNG ~8s
         (render-blocking) before failing — it was the site's entire load time.
         minimal-mistakes already provides code highlighting via main.css. -->

    <!-- Sidebar TOC (cdn.rawgit.com) removed: RawGit shut down in 2019; the URL
         would hang the same way on any TOC-sidebar page. -->

    <!-- Styles -->
    {% if site.icon.size <= 4 %}
    <link rel="shortcut icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>{{ site.icon }}</text></svg>">
    {% elsif site.icon != blank %}
    <link rel="shortcut icon" href="{{ site.icon | prepend: '/assets/img/' | relative_url}}"/>
    {% endif %}
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">

    <!-- Dark Mode -->
    {% if site.enable_darkmode %}
    <!-- dark-mode Pygments link removed (same empty-variable bug as the light one) -->
    <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/dark_mode.js' | relative_url }}"></script>
    {% endif %}
